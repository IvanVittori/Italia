<!DOCTYPE html>
<html lang="es">

<head>
    <title>Formulario - Reserva de Espacios / Aulas / Aulas de Cómputo</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="imagenes/imagesformulario.jpg">
    <link rel="stylesheet" type="text/css" href="Estilos/estilos.css">
</head>

<body>

    <main class="contenedor">
        
        <header class="encabezado">
            <h1>Reserva de Espacios</h1>
            <p>Solicitá un aula, sala de reuniones o laboratorio.</p>
        </header>

        <form name="FormPrincipal" action="index.html" method="get" accept-charset="UTF-8">

            <div class="campo">
                <label for="nombre">Nombre: </label>
                <input type="text" name="nombre" id="nombre"
                placeholder="Escriba su nombre"
                size="25"
                autofocus>

                <label for="apellido">Apellido: </label>
                <input type="text" name="apellido" id="apellido"
                placeholder="Escriba su apellido"
                size="25"
                autofocus>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ivanvittori@gmail.com" required>
            </div>

            <div class="campo">
                <label for="recurso">Recurso a reservar</label>
                <select id="recurso" name="recurso" required>
                    <option value="">Seleccioná un espacio</option>
                    <option value="aula">Aula</option>
                    <option value="sala">Sala de reuniones</option>
                    <option value="computo">Aula de cómputo</option>
                    <option value="laboratorio">Laboratorio</option>
                    <option value="auditorio">Auditorio</option>
                </select>
            </div>

            <div class="campo">
                <label for="motivo">Motivo de la reserva</label>
                <input type="text" id="motivo" name="motivo"
                       placeholder="Ej.: capacitación, reunión, clase"
                       required>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="fecha-inicio">Fecha de inicio</label>
                    <input type="date" id="fecha-inicio"
                           name="fecha_inicio" required>
                </div>

                <div class="campo">
                    <label for="hora-inicio">Hora de inicio</label>
                    <input type="time" id="hora-inicio"
                           name="hora_inicio" required>
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="fecha-fin">Fecha de finalización</label>
                    <input type="date" id="fecha-fin"
                           name="fecha_fin" required>
                </div>

                <div class="campo">
                    <label for="hora-fin">Hora de finalización</label>
                    <input type="time" id="hora-fin"
                           name="hora_fin" required>
                </div>
            </div>

            <div class="campo">
                <label for="asistentes">Cantidad de asistentes</label>
                <input type="number" id="asistentes"
                       name="asistentes" min="1"
                       placeholder="Ej.: 20" required>
            </div>

            <fieldset class="requerimientos">
                <legend>Requerimientos especiales</legend>

                <label class="opcion">
                    <input type="checkbox" name="requerimientos[]"
                           value="proyector">
                    Proyector
                </label>

                <label class="opcion">
                    <input type="checkbox" name="requerimientos[]"
                           value="sonido">
                    Equipo de sonido
                </label>

                <label class="opcion">
                    <input type="checkbox" name="requerimientos[]"
                           value="aire">
                    Aire acondicionado
                </label>

                <label class="opcion">
                    <input type="checkbox" name="requerimientos[]"
                           value="computadoras">
                    Computadoras
                </label>

                <label class="opcion">
                    <input type="checkbox" name="requerimientos[]"
                           value="videoconferencia">
                    Videoconferencia
                </label>
            </fieldset>

            <div class="campo">
                <label for="observaciones">
                    Observaciones adicionales
                </label>
                <textarea id="observaciones" name="observaciones"
                          rows="4"
                          placeholder="Indicá cualquier requerimiento adicional..."></textarea>
            </div>

            <button type="submit">Solicitar reserva</button>

            <p class="nota">
                La solicitud estará sujeta a la disponibilidad del espacio.
            </p>

        </form>

    </main>

</body>
</html>
